[package]
name = "marta-gtfs-rt"
version = "0.1.0"
edition = "2024"
description = "Converts MARTA rail realtime arrivals into GTFS-Realtime using MARTA static GTFS for trip matching"
license = "AGPL-3.0"

[dependencies]
chrono = "0.4.38"
chrono-tz = "0.10.4"
gtfs-realtime = "0.2.0"
gtfs-structures = "0.46.1"
prost = "0.14"
reqwest = { version = "0.12.5", features = ["json"] }
serde = { version = "1.0.204", features = ["derive"] }
serde_json = "1.0.122"

[dev-dependencies]
tokio = { version = "1.39.2", features = ["full"] }
